<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">{% seo %}
<link rel="stylesheet" href="{{ '/assets/apple.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('lea-theme')||'light'}catch(e){}</script>
</head><body>
<a class="skip-link" href="#main">跳转到正文</a>
<header class="site-header"><div class="nav-shell">
<a class="brand" href="{{ '/' | relative_url }}" aria-label="Lea 的学习笔记首页">Lea<span> / 学习笔记</span></a>
<nav class="main-nav" aria-label="主导航">
<a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>探索</a>
<a href="{{ '/categories/' | relative_url }}" {% if page.category_id or page.url == '/categories/' %}aria-current="page"{% endif %}>分类</a>
<a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}aria-current="page"{% endif %}>归档</a>
<a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>关于</a>
</nav>
<div class="nav-actions">
<a class="icon-button" href="{{ '/search/' | relative_url }}" aria-label="搜索笔记"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></a>
<button class="icon-button rounded-full font-medium transition-all duration-300" id="theme-toggle" type="button" aria-label="切换深色模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a8 8 0 0 1-10-10A8 8 0 1 0 20 14Z"/></svg></button>
</div></div></header>
<main id="main" class="site-main" tabindex="-1">{{ content }}</main>
<footer class="site-footer"><div><a class="footer-brand" href="{{ '/' | relative_url }}">Lea 的学习笔记</a><p>把知识连起来，把理解留下来。</p></div><div class="footer-links"><a href="{{ '/categories/' | relative_url }}">内容分类</a><a href="https://github.com/Lea-32">GitHub ↗</a><span>© {{ 'now' | date: '%Y' }} Lea</span></div></footer>
<script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body></html>
